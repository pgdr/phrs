[package]
name = "phrs"
version = "0.3.1"
edition = "2024"
description = "A tabular data shell tool compatible with ph"
license = "MIT"
repository = "https://github.com/pgdr/phrs"
readme = "README.md"
categories = ["command-line-utilities", "text-processing"]
keywords = ["csv", "excel", "dataframe", "polars", "cli"]

[lib]
name = "phrs"
path = "src/lib.rs"

[[bin]]
name = "phrs"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55.2", default-features = false, features = [
    "csv",
    "dtype-slim",
    "strings",
    "lazy",
    "diff",
    "temporal",
    "dtype-time",
]}

chrono = { version = "0.4", default-features = false, features = ["std"] }

calamine = { version = "0.36.1", default-features = false, features = ["chrono"] }
csv = "1"

tabulate-rs = "=0.1.0"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
